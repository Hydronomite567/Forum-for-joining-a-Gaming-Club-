<!DOCTYPE html>

    <title>Forum</title>

    <head>

        <h1 style="color: black;text-align: center;">Sign up below:</h1>

        <style>

            form{

                text-align: center;
                margin-left: 20%;
                margin-right: 20%;
                margin-top:100px;
                margin-bottom: 100px;
                text-align:center;
                padding:30px;
                background-color:gray;
                border-radius:5px;

            }

            a{

                text-decoration: none;
                color:skyblue;
                padding:10px;
                background-color:black;
                border-radius: 5px;

            }

            button{

                background-color: gray;
                padding: 10px;

            }

            label{

                color:beige;

            }

            body{

                background-color: azure;

            }

            textarea,input{

                width:50%;
                border-radius:5px;

            }

        </style>

    </head>

    <body>

        <form action="Thank_you.html">

            <label>Name (can be alias too):</label>
            <br>
            <input required type="text" minlength="0" maxlength="20">
            <br>
            <label>Age:</label>
            <br>
            <input required type="number" length="0" length="20">
            <br>
            <label>Email:</label>
            <br>
            <input required type="email">
            <br>
            <label>Console:</label>
            <br>
            <select required>
                <option>PS5</option>
                <option>XBOX</option>
                <option>PC</option>
            </select>
            <br>
            <br>
            <button>Submit</button>

        </form>

        <div style="display:flex;justify-content:center;">
        <a href="index2.html">Go back</a>
        </div>

    </body>

</html>
